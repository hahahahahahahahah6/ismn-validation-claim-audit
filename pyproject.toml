[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ismn-validation-claim-audit"
version = "0.1.0"
description = "Offline audit of documented music-number claims"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
ismn-validation-claim-audit = "ismn_validation_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["ismn_validation_claim_audit*"]
